name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest # クラウド上のLinuxマシン（Ubuntu）で実行

    steps:
      # 1. GitHubからコードをダウンロードしてくる
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ロボットにNode.jsの環境を作る（あなたの環境と同じv22を指定）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm' # インストールを速くするためのキャッシュ設定

      # 3. 依存ライブラリをクリーンインストール
      - name: Install dependencies
        run: npm ci

      # 4. Biomeを使って、コードが綺麗か（エラーがないか）チェック
      - name: Run Biome Check
        run: npx @biomejs/biome check .

      # 5. 自動テストの実行
      - name: Run Tests
        run: npm run test:run

      # 6. Viteを使って、本番公開用のファイルをビルドできるかチェック
      - name: Build App
        run: npm run build

      # ▼一番最後にこれを追加▼
      - name: Send CI Result to Discord
        if: always() # 成功・失敗に関わらず絶対に実行する
        uses: actions/github-script@v7
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }} # success, failure, cancelled のいずれかが入る
        with:
          script: |
            const status = process.env.STATUS;
            const webhookUrl = process.env.WEBHOOK_URL;
            if (!webhookUrl) return;

            // ステータスに応じてアイコンと文言を変更
            const isSuccess = status === 'success';
            const icon = isSuccess ? '✅' : '❌';
            const text = isSuccess ? '成功しました！' : '失敗しました...ログを確認してください。';
            
            const message = `${icon} **CI/CDパイプライン** が完了・終了しました。\n結果: **${status}** (${text})\n🔗 [GitHub Actionsのログを見る](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            
            await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: message })
            });