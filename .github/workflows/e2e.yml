name: E2E Tests on Vercel Preview

# Vercelのデプロイ状況が変わった時だけ発動！
on:
  deployment_status:

jobs:
  e2e-test:
    # Vercelのプレビュー環境のデプロイが「成功」した時だけ実行
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      # ここでVercelのURLをPlaywrightに渡してテスト！
      - name: Run E2E Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run test:e2e